name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/lib/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Permissions the GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            site/yarn.lock

      # The site type-checks against the library's built declarations, so build the lib first.
      - name: Build library
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build site
        working-directory: site
        run: |
          yarn install --frozen-lockfile
          yarn typecheck
          yarn build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
